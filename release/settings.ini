# NHL94Recomp settings. Place this file next to NHL94Recomp.exe and edit it
# with any text editor; it is read at startup. Delete it to return to the
# defaults (which are what this file contains).
#
# Controller bindings use SDL "GameController" names, so the numbers below
# refer to the STANDARD layout (Xbox-style) regardless of the physical pad:
#   button:0 = A (south)     button:1 = B (east)     button:2 = X (west)
#   button:3 = Y (north)     button:4 = Back/Select  button:5 = Guide
#   button:6 = Start         button:7 = left stick   button:8 = right stick
#   button:9 = left shoulder button:10 = right shoulder
#   button:11 = D-pad up     button:12 = D-pad down
#   button:13 = D-pad left   button:14 = D-pad right
#   axis:0:- / axis:0:+ = left stick left / right     axis:1:- / axis:1:+ = up / down
#   axis:2 / axis:3 = right stick,  axis:4:+ / axis:5:+ = left / right trigger
#   none = unbound
# On a SNES-style pad SDL usually reports: B=button:0, A=button:1, Y=button:2,
# X=button:3, Select=button:4, Start=button:6, L=button:9, R=button:10.
#
# Keyboard bindings are SDL scancodes (numbers): A=4 B=5 C=6 ... Z=29,
# 1=30 ... 0=39, Return=40, Escape=41, Backspace=42, Tab=43, Space=44,
# Right=79 Left=80 Down=81 Up=82, Comma=54, Slash=56, Right Shift=229.
#
# NHL 94 is a 3-button game: it uses Up/Down/Left/Right, A, B, C and Start.
# Leave pad_type = 0. Fixed hotkeys on a 3-button pad: Back/Select held =
# turbo, left/right shoulder = quicksave/quickload (disabled for this game).
# Keyboard hotkeys: Tab held = turbo, F11 = fullscreen, Esc = quit.

[video]
window_scale = 2
fullscreen = 0        ; 0 windowed, 1 borderless fullscreen, 2 exclusive
linear_filter = 0

[audio]
volume = 100

[input.p1]
device = 3        ; 0 none, 1 keyboard, 2 gamepad, 3 both
pad_type = 0      ; 0 = 3-button, 1 = 6-button
deadzone = 25
key.Up = 82
key.Down = 81
key.Left = 80
key.Right = 79
key.A = 29
key.B = 27
key.C = 6
key.Start = 40
key.X = 4
key.Y = 22
key.Z = 7
key.Mode = 42
pad.Up = button:11
pad.Down = button:12
pad.Left = button:13
pad.Right = button:14
pad.A = button:1
pad.B = button:0
pad.C = button:2
pad.Start = button:6
pad.X = button:3
pad.Y = button:9
pad.Z = button:10
pad.Mode = button:4

[input.p2]
device = 0        ; set to 2 (or 3) to enable a second player on the second pad
pad_type = 0
deadzone = 25
key.Up = 12
key.Down = 14
key.Left = 13
key.Right = 15
key.A = 17
key.B = 16
key.C = 54
key.Start = 229
key.X = 24
key.Y = 18
key.Z = 19
key.Mode = 56
pad.Up = button:11
pad.Down = button:12
pad.Left = button:13
pad.Right = button:14
pad.A = button:1
pad.B = button:0
pad.C = button:2
pad.Start = button:6
pad.X = button:3
pad.Y = button:9
pad.Z = button:10
pad.Mode = button:4
