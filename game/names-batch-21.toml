# Names batch 21 - see docs/names/names-batch-21.md.
# Apply: python tools/nhl94_names.py apply game/names-batch-21.toml
# From here on the remaining routines have no direct callers in the listing
# (reached through dispatch tables or jump tables); evidence leans on their
# bodies and the RAM they touch. Also corrected batch 20's $A600 to
# AdvanceReplayFrame once the replay ring became clear here.

